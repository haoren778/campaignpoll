
<script>
(function () {
  var urlParams = new URLSearchParams(window.location.search);
  var encodedData = urlParams.get('data');

  if (!encodedData) {
    document.getElementById('message').innerHTML = '<p style="color:red;">Invalid link.</p>';
    return;
  }

  try {
    // Decode Base64
    var jsonString = decodeURIComponent(atob(encodedData));
    var campaignData = JSON.parse(jsonString);

    // Set title
    document.getElementById('campaignTitle').innerText = campaignData.name || 'CampaignPoll';

    var container = document.getElementById('candidatesList');
    container.innerHTML = '<h2>Select your candidate(s)</h2>';

    campaignData.candidates.forEach(function (name, index) {
      var div = document.createElement('div');
      div.className = 'candidate';

      var id = 'cand' + index;
      div.innerHTML =
        '<input type="checkbox" id="' + id + '" value="' + name + '">' +
        '<label for="' + id + '">' + name + '</label>';

      container.appendChild(div);
    });

    var btn = document.createElement('button');
    btn.innerText = 'Submit Vote';
    btn.onclick = submitVote;
    container.appendChild(btn);

  } catch (e) {
    console.error(e);
    document.getElementById('message').innerHTML = '<p style="color:red;">Failed to load campaign.</p>';
  }

  function submitVote() {
    var checked = document.querySelectorAll('input[type="checkbox"]:checked');
    if (checked.length === 0) {
      alert('Please select at least one candidate.');
      return;
    }

    var names = [];
    checked.forEach(function (cb) {
      names.push(cb.value);
    });

    alert('✅ Thank you for voting!\n\nYour choices:\n' + names.join('\n'));
  }
})();
</script>
