<script>
  // 从 URL 读取数据
  const urlParams = new URLSearchParams(window.location.search);
  const encodedData = urlParams.get('data');

  if (!encodedData) {
    document.getElementById('message').innerHTML = '<p style="color:red;">Invalid or expired link.</p>';
  } else {
    try {
      // 解码数据
      const jsonString = decodeURIComponent(atob(encodedData));
      const campaignData = JSON.parse(jsonString);

      // 显示竞选标题
      document.getElementById('campaignTitle').innerText = campaignData.name;

      const candidatesDiv = document.getElementById('candidatesList');
      candidatesDiv.innerHTML = '<h2>Select your candidate(s)</h2>';

      campaignData.candidates.forEach((candidate, index) => {
        const div = document.createElement('div');
        div.className = 'candidate';
        div.innerHTML = `
          <input type="checkbox" id="cand${index}" value="${candidate}">
          <label for="cand${index}">${candidate}</label>
        `;
        candidatesDiv.appendChild(div);
      });

      const voteBtn = document.createElement('button');
      voteBtn.textContent = 'Submit Vote';
      voteBtn.onclick = submitVote;
      candidatesDiv.appendChild(voteBtn);

    } catch (e) {
      document.getElementById('message').innerHTML = '<p style="color:red;">Failed to load campaign.</p>';
    }
  }

  // 投票逻辑（暂时存在浏览器里，刷新会重置，后续接数据库）
  function submitVote() {
    const selected = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
      .map(cb => cb.value);

    if (selected.length === 0) {
      alert('Please select at least one candidate.');
      return;
    }

    // 这里暂时只是模拟成功
    // 后面我们会把这里改成真实的 API 调用 (Part D)
    alert('✅ Thank you for voting!\n\nSelected:\n' + selected.join('\n'));
  }
</script>
