
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vote - CampaignPoll</title>
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1 id="campaignTitle">CampaignPoll</h1>
    </header>
    <main>
      <div id="candidatesList"></div>
      <div id="message"></div>
    </main>
  </div>

  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var data = params.get('data');
    if (!data) {
      document.getElementById('message').innerHTML = '<p style="color:red;">Invalid link.</p>';
      return;
    }
    try {
      var obj = JSON.parse(decodeURIComponent(atob(data)));
      document.getElementById('campaignTitle').innerText = obj.name || 'CampaignPoll';
      var box = document.getElementById('candidatesList');
      box.innerHTML = '<h2>Select your candidate(s)</h2>';
      obj.candidates.forEach(function (n, i) {
        var id = 'c' + i;
        box.innerHTML += '<div class="candidate"><input type="checkbox" id="' + id + '" value="' + n + '"><label for="' + id + '"> ' + n + '</label></div>';
      });
      var btn = document.createElement('button');
      btn.innerText = 'Submit Vote';
      btn.onclick = function () {
        var chk = document.querySelectorAll('input[type="checkbox"]:checked');
        if (!chk.length) { alert('Please select at least one.'); return; }
        var v = [];
        chk.forEach(function (c) { v.push(c.value); });
        alert('✅ Voted!\n' + v.join('\n'));
      };
      box.appendChild(btn);
    } catch (e) {
      document.getElementById('message').innerHTML = '<p style="color:red;">Link broken.</p>';
      console.error(e);
    }
  })();
  </script>
</body>
</html>
